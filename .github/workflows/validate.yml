name: 初始化规则验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: 清单与项目结构
        run: |
          python3 -I scripts/check-manifests.py .
          python3 -I scripts/check-system.py
      - name: 规则回归
        run: python3 -I scripts/test-check-system.py
