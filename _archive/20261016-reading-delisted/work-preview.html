<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品详情排版预览 · 智能时代蛮子</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="lab"><div class="shell"><p class="lab-title">独立页面定标样本 / 内容待确认 / 非公开站点</p></div></div>
  <div class="shell">
    <header class="site-header">
      <a class="site-name" href="prototype.html">智能时代蛮子</a>
      <nav id="main-menu" aria-label="主导航">
        <a href="prototype.html">首页</a>
        <a href="essays.html">随笔</a>
        <a href="works.html" aria-current="page">作品</a>
        <a href="about.html">简介</a>
      </nav>
    </header>
    <main>
      <section id="work-preview" data-page="work-preview" aria-labelledby="work-preview-title" data-work-sample="true">
        <p class="eyebrow">仅用于确认详情排版</p>
        <h1 class="page-title" id="work-preview-title">作品详情排版预览</h1>
        <p class="sample-notice" data-work-preview-status>排版样本，非实际作品。没有登记名称、真实图标、介绍或公开链接；不计入本人作品。</p>
        <section class="essay-section" aria-labelledby="work-intro-title">
          <h2 class="overview-title" id="work-intro-title">作品介绍</h2>
          <p class="pending-copy">真实资料与公开范围待你提供；此页只验证图标行到独立详情的结构。</p>
        </section>
        <section class="essay-section" aria-labelledby="work-materials-title">
          <h2 class="overview-title" id="work-materials-title">内容与入口</h2>
          <p class="pending-copy">不虚构作品内容，也不填入未经确认的外部地址。</p>
        </section>
        <div class="article-return"><a data-entry="return-works" href="works.html">← 返回作品</a></div>
      </section>
    </main>
    <footer class="site-footer">本地布局样本 · 待你改定 · 非公开站点</footer>
  </div>
</body>
</html>
